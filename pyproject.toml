[project]
name = "bid-response-agent"
version = "0.8.0"
description = "应标 Agent：招标书解析 → 逐评分点检索应答 → 数值核对 → 漏项/风险自检 → 报告导出（含 eval-harness 评测）"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "uvicorn[standard]>=0.52.4",
]

[project.urls]
Homepage = "https://github.com/Aeloris/bid-response-rag-engine"
Repository = "https://github.com/Aeloris/bid-response-rag-engine"
Issues = "https://github.com/Aeloris/bid-response-rag-engine/issues"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
